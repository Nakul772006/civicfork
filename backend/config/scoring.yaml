# Context modifier sensitivity coefficients and rules
modifiers:
  traffic:
    road_capacity_bonus_weight: 10.0
    road_capacity_max_multiplier: 1.5
    major_road_bonus_close_m: 500.0
    major_road_bonus_close_points: 10.0
    major_road_bonus_medium_m: 1000.0
    major_road_bonus_medium_points: 5.0
    congestion_penalty_weight: 15.0
    visitor_load_penalty_weight: 20.0
    reference_daily_trips: 5000.0
  cost:
    area_scaling_penalty_weight: 15.0
    revenue_offset_bonus: 15.0
  environmental:
    green_change_weight: 20.0
    impervious_penalty_weight: 15.0
    green_deficit_threshold_pct: 15.0
    green_deficit_bonus_weight: 10.0
    industrial_adjacency_threshold_pct: 20.0
    industrial_adjacency_penalty: 5.0
  accessibility:
    transit_proximity_weight: 15.0
    transit_coverage_weight: 10.0
    transit_coverage_target_stops: 5.0
    road_connectivity_weight: 10.0
    population_density_weight: 10.0
    population_density_target: 10000.0
    remoteness_transit_threshold_m: 2000.0
    remoteness_road_density_factor: 0.5
    remoteness_penalty: 10.0
  social_utility:
    population_reach_weight: 15.0
    population_reach_target: 10000.0
    employment_weight: 10.0
    employment_target_jobs: 50.0
    gap_bonus_weight: 10.0
    underserved_area_bonus: 5.0
    underserved_poi_threshold_factor: 0.5

# Baseline reference parameters
references:
  road_density_m_per_sqkm: 10000.0
  poi_count: 100
  population_density_ref: 5000.0

