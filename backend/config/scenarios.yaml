scenarios:
  park:
    id: "park"
    name: "Parks / Recreational Space"
    category: "green_space"
    description: "Public urban park with green landscaping, walking paths, recreational areas, and native tree canopy."
    default_area_sqm: 2000.0
    ref_area_sqm: 2000.0
    cost_per_sqm: 5000.0
    operating_ratio: 0.05
    base_visitors: 200
    jobs_per_1000sqm: 2.0
    base_traffic_pct: 5.0
    trip_rate: 1.2
    green_ratio: 0.85
    impervious_ratio: 0.10
    revenue_generating: false
    addresses_gaps:
      - "parks"
      - "community"
    attributes:
      amenities:
        - "walking_trail"
        - "benches"
        - "tree_canopy"
        - "children_play_area"
      maintenance_frequency: "bi-weekly"

